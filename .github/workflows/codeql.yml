name: "CodeQL C++ Analysis"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '23 11 * * 5'  # every Friday at 11:23 UTC

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby' ]

    steps:
    # ------------------------------------------------------------
    # 1️ Checkout repository
    # ------------------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # ------------------------------------------------------------
    # 2️ Initialize CodeQL
    # ------------------------------------------------------------
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: ${{ matrix.language }}
        # Optional: include extended security rules
        # queries: +security-extended

    # ------------------------------------------------------------
    # 3️ Manual CMake build (replaces autobuild)
    # ------------------------------------------------------------
    - name: Build project manually using CMake
      run: |
        sudo apt-get update -y
        sudo apt-get install -y build-essential cmake

        mkdir -p build
        cd build

        # Configure project (disable docs/tests to simplify)
        cmake -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_DOCS=OFF \
              -DCATKIN_ENABLE_TESTING=OFF \
              -DBUILD_DOCUMENTATION=OFF ..

        # Compile your C++ targets
        make -j$(nproc)
      env:
        CODEQL_EXTRACTOR_CPP_AUTOINSTALL_DEPENDENCIES: false

    # ------------------------------------------------------------
    # 4️ Run CodeQL static analysis
    # ------------------------------------------------------------
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2
      with:
        category: "/language:${{ matrix.language }}"
